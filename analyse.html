<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vokabeltrainer – Formen-Check</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-page="analyse">
<main>
  <div class="page-header">
    <h2>Formen-Check</h2>
    <p>Gib eine lateinische Form ein – wir bestimmen sie und suchen passende Vokabeln in den Büchern.</p>
  </div>

  <div class="card" style="margin-bottom:1.25rem;">
    <div class="inline-form">
      <input type="text" id="analyse-input" class="input" placeholder="z.B. amarem, puellae, sumus…" autocomplete="off">
      <button class="btn btn-primary" onclick="runAnalyse();">Analysieren</button>
    </div>
  </div>

  <div id="analyse-results"></div>
</main>
<script src="layout.js"></script>
<script src="auth-check.js"></script>
<script src="latin-analyzer.js"></script>
<script src="script.js"></script>
</body>
</html>
