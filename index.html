<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vokabeltrainer – Anmelden</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-page="login">
  <div style="position: fixed; top: 1rem; right: 1rem; display:flex; gap:0.5rem;">
    <a href="info.html" class="btn btn-ghost btn-small">Info</a>
    <button class="btn btn-ghost icon-btn" id="theme-toggle" title="Hell/Dunkel"><span id="theme-icon">☾</span></button>
  </div>

  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="brand-mark" style="width:36px;height:36px;font-size:0.95rem;">VT</div>
      <span>Vokabeltrainer</span>
    </div>

    <div class="auth-card">
      <div id="login-view" class="view">
        <div class="tabs" style="display:flex; width:100%;">
          <button class="tab active" style="flex:1;" onclick="switchAuthTab('login')">Anmelden</button>
          <button class="tab" style="flex:1;" onclick="switchAuthTab('register')">Registrieren</button>
        </div>

        <div id="login-form">
          <div class="form-group">
            <label>Benutzername</label>
            <input type="text" id="login-username" placeholder="dein Benutzername" autocomplete="username">
          </div>
          <div class="form-group">
            <label>Passwort</label>
            <input type="password" id="login-password" placeholder="" autocomplete="current-password">
          </div>
          <button class="btn btn-primary btn-large btn-block" onclick="login();">Anmelden</button>
        </div>

        <div id="register-form" class="hidden">
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 0.6rem;">
            <div class="form-group" style="margin:0;">
              <label>Vorname</label>
              <input type="text" id="reg-vorname">
            </div>
            <div class="form-group" style="margin:0;">
              <label>Nachname</label>
              <input type="text" id="reg-nachname">
            </div>
          </div>
          <div class="form-group" style="margin-top:0.75rem;">
            <label>Benutzername</label>
            <input type="text" id="reg-username">
          </div>
          <div class="form-group">
            <label>Passwort</label>
            <input type="password" id="reg-password" placeholder="">
          </div>
          <div class="form-group">
            <label>Rolle</label>
            <div class="role-select" style="display:flex; width:100%;">
              <button class="role-btn active" style="flex:1;" data-role="schueler" onclick="selectRole('schueler')">Schüler</button>
              <button class="role-btn" style="flex:1;" data-role="lehrer" onclick="selectRole('lehrer')">Lehrer</button>
            </div>
          </div>
          <div class="form-group hidden" id="teacher-code-group">
            <label>Lehrer-Code</label>
            <input type="password" id="reg-teacher-code" placeholder="Registrierungscode">
          </div>
          <button class="btn btn-primary btn-large btn-block" onclick="register();">Registrieren</button>
        </div>

        <div id="auth-error" class="error-msg"></div>
      </div>
    </div>

    <p class="text-muted" style="text-align:center; margin-top:1rem; font-size:0.85rem;">
      Wie funktioniert die Korrektur? Siehe <a href="info.html">Info</a>.
    </p>
  </div>
  <script src="script.js"></script>
</body>
</html>
