<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vokabeltrainer – Anmelden</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-page="login">
  <header>
    <div class="header-content">
      <h1>Vokabeltrainer</h1>
      <div class="header-right">
        <a href="info.html" class="btn btn-ghost btn-small">Info</a>
        <button class="btn btn-ghost theme-toggle" id="theme-toggle" title="Dark Mode umschalten">
          <span class="theme-icon" id="theme-icon">&#9790;</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="login-view" class="view">
      <div class="hero">
        <h2>Willkommen beim Vokabeltrainer</h2>
        <p>Melde dich an oder erstelle einen Account.</p>
      </div>
      <div class="auth-card">
        <div class="tabs">
          <button class="tab active" onclick="switchAuthTab('login')">Anmelden</button>
          <button class="tab" onclick="switchAuthTab('register')">Registrieren</button>
        </div>

        <div id="login-form">
          <div class="form-group">
            <label>Benutzername</label>
            <input type="text" id="login-username" placeholder="Benutzername">
          </div>
          <div class="form-group">
            <label>Passwort</label>
            <input type="password" id="login-password" placeholder="Passwort">
          </div>
          <button class="btn btn-primary btn-large" style="width:100%;" onclick="login();">Anmelden</button>
        </div>

        <div id="register-form" class="hidden">
          <div class="form-group">
            <label>Vorname</label>
            <input type="text" id="reg-vorname" placeholder="Vorname">
          </div>
          <div class="form-group">
            <label>Nachname</label>
            <input type="text" id="reg-nachname" placeholder="Nachname">
          </div>
          <div class="form-group">
            <label>Benutzername</label>
            <input type="text" id="reg-username" placeholder="Benutzername">
          </div>
          <div class="form-group">
            <label>Passwort</label>
            <input type="password" id="reg-password" placeholder="Passwort (Standard: 0000)">
          </div>
          <div class="form-group">
            <label>Rolle</label>
            <div class="role-select">
              <button class="role-btn active" data-role="schueler" onclick="selectRole('schueler')">Schüler</button>
              <button class="role-btn" data-role="lehrer" onclick="selectRole('lehrer')">Lehrer</button>
            </div>
          </div>
          <div class="form-group hidden" id="teacher-code-group">
            <label>Lehrer-Code</label>
            <input type="password" id="reg-teacher-code" placeholder="Lehrer-Registrierungscode">
          </div>
          <button class="btn btn-primary btn-large" style="width:100%;" onclick="register();">Registrieren</button>
        </div>

        <div id="auth-error" class="error-msg"></div>
      </div>

      <p class="text-muted center" style="margin-top:1rem; font-size:0.9rem;">
        Mehr über die Korrekturlogik erfährst du auf der <a href="info.html" style="color:var(--primary);">Info-Seite</a>.
      </p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
